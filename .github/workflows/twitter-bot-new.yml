name: Twitter Bot Automation

on:
  schedule:
    # Өдөрт 5 удаа (UTC цагаар)
    # Монголын цаг = UTC + 8
    - cron: '0 1 * * *'   # 09:00 (Монгол)
    - cron: '0 5 * * *'   # 13:00 (Монгол)
    - cron: '0 9 * * *'   # 17:00 (Монгол)
    - cron: '0 13 * * *'  # 21:00 (Монгол)
    - cron: '0 15 * * *'  # 23:00 (Монгол)
  workflow_dispatch: # Гараар ажиллуулах боломж

jobs:
  post-tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Create logs directory
        run: mkdir -p logs

      - name: Run bot script
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: node src/index.js

      - name: Commit posted titles
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/posted_titles.json || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update posted titles [skip ci]"
          git push || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs
          path: logs/
          retention-days: 7
