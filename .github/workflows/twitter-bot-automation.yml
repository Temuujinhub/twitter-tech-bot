name: Twitter Bot Automation (Fixed)

on:
  schedule:
    # Өдөрт 5 удаа (UTC цагаар)
    # Монголын цаг = UTC + 8
    - cron: '0 1 * * *'   # 09:00 (Монгол)
    - cron: '0 5 * * *'   # 13:00 (Монгол)
    - cron: '0 9 * * *'   # 17:00 (Монгол)
    - cron: '0 13 * * *'  # 21:00 (Монгол)
    - cron: '0 15 * * *'  # 23:00 (Монгол)
  workflow_dispatch: # Гараар ажиллуулах боломж

jobs:
  post-tweet:
    runs-on: ubuntu-latest
    
    # ШИНЭ: Permission нэмэв - git push ажиллахын тулд
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # ШИНЭ: fetch-depth 0 - бүх git history татах
          fetch-depth: 0
          # ШИНЭ: token ашиглах - push хийхэд хэрэгтэй
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Create logs directory
        run: mkdir -p logs

      # ШИНЭ: Одоогийн posted_links.json файлыг хуулах (backup)
      - name: Backup posted links
        run: |
          if [ -f data/posted_links.json ]; then
            cp data/posted_links.json data/posted_links.backup.json
            echo "✅ Backup хийгдлээ"
          else
            echo "[]" > data/posted_links.json
            echo "⚠️ Шинэ posted_links.json файл үүсгэлээ"
          fi

      - name: Run bot script
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node src/index.js

      # ЗАСВАРЛАСАН: Posted links commit & push - илүү найдвартай
      - name: Commit and push posted links
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Git хувилбаруудыг шалгах
          echo "📝 Git статус:"
          git status
          
          # posted_links.json файл өөрчлөгдсөн эсэхийг шалгах
          if [ -f data/posted_links.json ]; then
            git add data/posted_links.json
            
            # Өөрчлөлт байгаа эсэхийг шалгах
            if git diff --staged --quiet; then
              echo "⚠️ Өөрчлөлт байхгүй, commit хийхгүй"
            else
              git commit -m "Update posted links [skip ci] - $(date +'%Y-%m-%d %H:%M:%S')"
              
              # Push хийх - retry логиктой
              max_retries=3
              retry_count=0
              
              while [ $retry_count -lt $max_retries ]; do
                if git push; then
                  echo "✅ Git push амжилттай!"
                  break
                else
                  retry_count=$((retry_count + 1))
                  echo "⚠️ Push амжилтгүй, дахин оролдож байна ($retry_count/$max_retries)..."
                  sleep 5
                  git pull --rebase origin HEAD || true
                fi
              done
              
              if [ $retry_count -eq $max_retries ]; then
                echo "❌ Git push амжилтгүй боллоо!"
                exit 1
              fi
            fi
          else
            echo "⚠️ posted_links.json файл олдсонгүй"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7
