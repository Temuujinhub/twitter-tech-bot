name: Twitter Tech Bot

on:
  schedule:
    # Өдөрт 5 удаа (UTC цагаар)
    # Монголын цаг = UTC + 8
    - cron: '0 1 * * *'   # 09:00 (Монгол)
    - cron: '0 5 * * *'   # 13:00 (Монгол)
    - cron: '0 9 * * *'   # 17:00 (Монгол)
    - cron: '0 13 * * *'  # 21:00 (Монгол)
    - cron: '0 15 * * *'  # 23:00 (Монгол, )
  
  # Гараар ажиллуулах боломж
  workflow_dispatch:

jobs:
  post-tweet:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run Twitter Bot
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        run: node src/index.js
      
      - name: Upload artifacts (logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs
          path: |
            logs/*.log
            data/latest_news.json
          retention-days: 7
